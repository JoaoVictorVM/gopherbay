version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    misspell:
      locale: US
      # misspell only knows English and flags the pt-BR messages shown to the user.
      ignore-rules:
        - argumentos
        - comando
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      kv-only: true
      static-msg: true
      key-naming-case: snake
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Tests build and run the binary with arguments they define themselves.
      - path: _test\.go
        linters:
          - gosec
        text: G204
      # Every path here derives from the config file the user chose with --config
      # or the default location, which gbay must read and replace by design.
      - path: internal/config/(atomic|store)\.go
        linters:
          - gosec
        text: G703

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/JoaoVictorVM/gopherbay
